<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/defaultLayout}">

<div layout:fragment="content">
    <div class="post-detail-container">
        <h1 class="post-title" th:text="${post.title}"></h1>
        <div class="post-meta">
            <span class="author-badge" th:text="${post.authorId}"></span>
            <span class="date" th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}"></span>
            <span class="views">조회수 <strong th:text="${post.viewCount}"></strong></span>
        </div>

        <hr class="detail-divider">
        <div class="post-content" th:text="${post.content}" style="white-space: pre-line; min-height: 150px;"></div>

        <div class="post-attachment" th:if="${post.attachmentUrl}">
            <h3 style="font-size: 14px; margin-bottom: 10px;">📎 첨부 파일</h3>
            <img th:src="@{${post.attachmentUrl}}" alt="첨부 이미지" style="max-width:100%; border-radius: 8px;"/>
        </div>

        <div class="post-footer" style="margin-top: 30px; display: flex; justify-content: space-between; align-items: center;">
            <small th:text="'마지막 수정: ' + ${#temporals.format(post.updatedAt, 'yyyy-MM-dd HH:mm')}" style="color: #94a3b8;"></small>

            <div class="post-actions">
                <button class="btn-action" onclick="history.back()">목록</button>
                <button class="btn-action btn-update" th:onclick="|location.href='/post/update?postId=' + ${post.postId}|">수정</button>
                <button class="btn-action btn-delete" th:onclick="|location.href='/post/delete?postId=' + ${post.postId}|">삭제</button>
            </div>
        </div>
    </div>

    <!-- 댓글 섹션 -->
    <div th:replace="~{fragments/comment :: comment(${post}, ${commentList}, ${comment})}"></div>
</div>

<th:block layout:fragment="script">
    <script th:src="@{/js/comment.js}"></script>
</th:block>
</html>
