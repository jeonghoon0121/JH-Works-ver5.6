<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/defaultLayout}">
<head>
    <title>새 글 작성 - JH Works</title>
</head>
<body>
<main layout:fragment="content">
    <div class="form-container">
        <!-- enctype 속성 확인 필수[cite: 6] -->
        <form class="board-form" th:action="@{/post/add}" th:object="${post}" method="post" enctype="multipart/form-data">

            <h2 class="form-title">✍️ 새 글 작성</h2>

            <!-- [쓰기 전용] 게시판 및 작성자 정보[cite: 6] -->
            <div class="form-row">
                <div class="form-group">
                    <label>게시판 선택</label>
                    <select th:field="*{boardId}" required>
                        <option th:each="board : ${boardList}"
                                th:value="${board.boardId}"
                                th:text="${board.name}"></option>
                    </select>
                </div>
                <div class="form-group">
                    <label>작성자 아이디</label>
                    <input type="text" th:field="*{authorId}" placeholder="아이디를 입력하세요" required>
                </div>
            </div>

            <!-- [공통 필드] 카테고리, 제목, 내용 프래그먼트 호출 -->
            <th:block th:replace="~{post/postFormFields :: commonFields}"></th:block>

            <!-- [쓰기 전용] 신규 비밀번호 설정[cite: 6] -->
            <div class="form-group">
                <label>비밀번호 설정</label>
                <input type="password" th:field="*{password}" placeholder="게시글 비밀번호 (최대 20자)" maxlength="20" required>
                <small class="form-text">수정/삭제 시 사용할 비밀번호를 입력해주세요.</small>
            </div>

            <!-- 파일 첨부 -->
            <div class="form-group">
                <label>첨부 파일</label>
                <input type="file" name="file">
            </div>

            <!-- 하단 버튼 그룹[cite: 6] -->
            <div class="btn-group">
                <button type="button" class="btn-cancel" onclick="history.back()">취소</button>
                <button type="submit" class="btn-submit">작성 완료</button>
            </div>
        </form>
    </div>
</main>
</body>
</html>
