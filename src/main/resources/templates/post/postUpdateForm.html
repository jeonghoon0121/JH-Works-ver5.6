<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/defaultLayout}">
<head>
    <title>게시글 수정 - JH Works</title>
</head>
<body>
<main layout:fragment="content">
    <div class="form-container">
        <!-- enctype 설정으로 파일 전송 보장 -->
        <form th:action="@{/post/update}" th:object="${post}" method="post" enctype="multipart/form-data" class="board-form">

            <h2 class="form-title">📝 게시글 수정</h2>
            <p class="form-desc">게시글 내용을 수정합니다. 본인 확인을 위해 기존 비밀번호를 입력해주세요.</p>

            <!-- 1. 식별자 보호: 삭제 폼과 동일하게 hidden 처리 -->
            <input type="hidden" th:field="*{postId}">

            <!-- 2. 공통 필드 프래그먼트 호출 -->
            <th:block th:replace="~{post/postFormFields :: commonFields}"></th:block>

            <!-- 3. 파일 변경 영역 -->
            <div class="form-group">
                <label>첨부 파일 변경</label>
                <div th:if="*{attachmentUrl != null and !attachmentUrl.empty}" class="current-file">
                    <span class="file-info">현재 파일: </span>
                    <a th:href="*{attachmentUrl}"
                       th:text="*{attachmentUrl.contains('_') ? attachmentUrl.substring(attachmentUrl.lastIndexOf('_') + 1) : attachmentUrl}"
                       target="_blank" class="file-link">기존파일</a>
                </div>
                <input type="file" name="file" class="form-control-file">
                <small class="form-text text-muted">새 파일을 선택하면 기존 파일은 교체됩니다.</small>
            </div>

            <!-- 4. [보안 수정] 비밀번호 확인 필드: autocomplete 속성 추가 -->
            <div class="form-group">
                <label for="password">비밀번호 확인</label>
                <input type="password" th:field="*{password}"
                       id="password"
                       autocomplete="current-password"
                       placeholder="기존 비밀번호를 입력하세요"
                       class="form-control" required>
            </div>

            <!-- 5. 버튼 그룹: 삭제 폼과 동일한 UX 제공 -->
            <div class="btn-group">
                <button type="button" class="btn-cancel" onclick="history.back()">취소</button>
                <button type="submit" class="btn-submit"
                        onclick="return confirm('수정된 내용을 저장하시겠습니까?')">수정 완료</button>
            </div>
        </form>
    </div>
</main>
</body>
</html>
