<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
    <style>
        .error-msg { color: red; font-size: 0.9em; margin-bottom: 10px; }
    </style>
</head>
<body>
<h2>로그인</h2>

<div th:if="${error}" class="error-msg" th:text="${error}"></div>

<form th:action="@{/member/login}" th:object="${member}" method="post">
    <input type="text" th:field="*{username}" placeholder="아이디" required />
    <input type="password" th:field="*{password}" placeholder="비밀번호" required />
    <button type="submit">로그인</button>
</form>

<p>계정이 없으신가요? <a th:href="@{/member/register}">회원가입</a></p>

</body>
</html>
