<header th:fragment="headerFragment">

    <!-- LEFT -->
    <div class="header-left">
        <button class="hamburger-btn" onclick="toggleSidebar()">☰</button>
        <a th:href="@{/}" class="logo">JH Works</a>
    </div>

    <!-- CENTER -->
    <div class="header-center">
        <nav class="main-nav">

            <!-- 상단 메뉴 -->
            <div class="nav-item"><a th:href="@{/about}">소개</a></div>
            <div class="nav-item"><a th:href="@{/features}">기능</a></div>
            <div class="nav-item"><a th:href="@{/tools}">도구</a></div>
            <div class="nav-item"><a th:href="@{/dashboard}">대시보드</a></div>
            <div class="nav-item">
                <a href="https://github.com/jeonghoon0121/JH-Works-ver5.6">깃허브</a>
            </div>

            <!-- ⭐ 통합 메가메뉴 (딱 1개만!) -->
            <div class="mega-menu">
                <div class="mega-grid">

                    <!-- 소개 -->
                    <div class="mega-column">
                        <h3>소개</h3>
                        <a th:href="@{/about/intro}">프로젝트 개요</a>
                        <a th:href="@{/about/techStack}">기술 스택</a>
                        <a th:href="@{/about/architecture&DB}">아키텍처</a>
                    </div>

                    <!-- 기능 -->
                    <div class="mega-column">
                        <h3>기능</h3>
                        <a th:href="@{/features/board}">게시판</a>
                        <a th:href="@{/features/member}">회원</a>
                        <a th:href="@{/features/admin}">관리</a>
                    </div>

                    <!-- 도구 -->
                    <div class="mega-column">
                        <h3>도구</h3>
                        <a th:href="@{/tools/calculator}">계산기</a>
                        <a href="#">유틸</a>
                    </div>

                    <!-- 시스템 -->
                    <div class="mega-column">
                        <h3>시스템</h3>
                        <a href="#">로그</a>
                        <a th:href="@{/dashboard}">대시보드</a>
                    </div>

                </div>
            </div>

        </nav>
    </div>

    <!-- RIGHT -->
    <div class="header-right">
        <th:block th:if="${session.loginMember == null}">
            <button class="btn-login" th:onclick="|location.href='@{/member/login}'|">로그인</button>
            <button class="btn-join" th:onclick="|location.href='@{/member/register}'|">회원가입</button>
        </th:block>
        <th:block th:if="${session.loginMember != null}">
            <span class="user-name" th:text="${session.loginMember.name} + '님'"></span>
            <button class="btn-logout" th:onclick="|location.href='@{/member/logout}'|">로그아웃</button>
        </th:block>
    </div>

</header>
