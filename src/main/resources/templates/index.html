<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/defaultLayout :: head}"></head>
<body>
<header th:replace="~{layout/defaultLayout :: header}"></header>

<main>
    <aside th:replace="~{layout/defaultLayout :: aside}"></aside>

    <article>
        <h2>환영합니다!</h2>
        <p>JH Works 시스템에 접속하신 것을 환영합니다.</p>

        <div th:if="${session.loginMember == null}" class="hero-cta">
            <p>더 많은 기능을 이용하시려면 서비스를 시작하세요.</p>
            <button th:onclick="|location.href='@{/member/register}'|" class="btn-inquiry">지금 시작하기</button>
        </div>
    </article>

</main>

<footer th:replace="~{layout/defaultLayout :: footer}"></footer>
</body>
</html>
