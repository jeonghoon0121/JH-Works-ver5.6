<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/defaultLayout :: layout(~{::article})}">
<head>
    <title>게시글 작성</title>
</head>
<article>
    <h2>게시글 등록</h2>
    <form th:action="@{/board/add}" th:object="${board}" method="post" class="board-form">
        <h2>게시판 신규 등록</h2>

        <div class="form-group">
            <label for="name">게시판 이름</label>
            <input type="text" th:field="*{name}" id="name" placeholder="예: 자유게시판" required />
        </div>

        <div class="form-group">
            <label for="description">게시판 설명</label>
            <input type="text" th:field="*{description}" id="description" placeholder="게시판에 대한 짧은 설명" />
        </div>

        <div class="checkbox-group">
            <label><input type="checkbox" th:field="*{userActive}" /> 사용자 활성</label>
            <label><input type="checkbox" th:field="*{adminActive}" /> 관리자 활성</label>
        </div>

        <button type="submit" class="btn-submit">게시판 등록하기</button>
    </form>
</article>
</html>
