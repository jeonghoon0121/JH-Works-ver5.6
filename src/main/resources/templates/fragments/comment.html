<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="comment(post, commentList, comment)">

<hr style="margin: 40px 0; border: 0; border-top: 1px solid var(--border-color);">

<section class="comment-section">
    <h3 style="margin-bottom: 20px;"><span th:text="${#lists.size(commentList)}" style="color: var(--accent-color);">0</span>개의 댓글</h3>
    <div class="comment-list">
        <div class="comment-card" th:each="comment : ${commentList}" style="background: #f8fafc; padding: 20px; border-radius: 12px; margin-bottom: 15px; border: 1px solid var(--border-color);">
            <div class="comment-header" style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                <span class="author" th:text="${comment.authorId}" style="font-weight: 700; color: var(--primary-color);"></span>
                <span class="date" th:text="${#temporals.format(comment.createdAt, 'yyyy-MM-dd HH:mm')}" style="font-size: 13px; color: var(--text-muted);"></span>
            </div>
            <div class="comment-body" th:text="${comment.content}" style="margin-bottom: 15px;"></div>
            <div class="comment-footer" style="text-align: right;">
                <button class="editBtn btn-action btn-update" th:data-id="${comment.commentId}" style="padding: 4px 10px; font-size: 12px;">수정</button>
                <button class="deleteBtn btn-action btn-delete" th:data-id="${comment.commentId}" style="padding: 4px 10px; font-size: 12px;">삭제</button>
            </div>
        </div>
    </div>
</section>

<section class="comment-form-section" style="margin-top: 30px;">
    <h3 style="margin-bottom: 15px;">댓글 남기기</h3>
    <form class="board-form" th:action="@{/comment/add}" th:object="${comment}" method="post" style="background: white; border: 1px solid var(--border-color); padding: 20px; border-radius: 12px;">
        <input type="hidden" name="postId" th:value="${post.postId}" />
        <div style="display: flex; gap: 10px; margin-bottom: 10px;">
            <input type="text" th:field="*{authorId}" placeholder="아이디" required style="flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color);" />
            <input type="password" th:field="*{password}" placeholder="비밀번호" required style="flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color);" />
        </div>
        <textarea th:field="*{content}" placeholder="댓글 내용을 입력하세요" required style="width: 100%; height: 80px; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); margin-bottom: 10px; font-family: inherit; resize: none;"></textarea>
        <button type="submit" class="btn-submit" style="width: 100%; margin-top: 0;">댓글 등록</button>
    </form>
</section>

<div id="commentModal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <h2>댓글 수정</h2>
        <form th:action="@{/comment/update}" method="post" class="board-form">
            <input type="hidden" name="postId" th:value="${post.postId}" />
            <div class="form-group">
                <label>댓글 번호</label>
                <input type="number" name="commentId" id="modalEditId" readonly style="background: #eee;" />
            </div>
            <div class="form-group">
                <label>아이디 확인</label>
                <input type="text" name="authorId" required />
            </div>
            <div class="form-group">
                <label>비밀번호 확인</label>
                <input type="password" name="password" required />
            </div>
            <div class="form-group">
                <label>내용 수정</label>
                <textarea name="content" required style="height: 100px; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color);"></textarea>
            </div>
            <div class="modal-btns">
                <button type="submit" class="btn-primary">확인</button>
                <button type="button" class="btn-danger close">취소</button>
            </div>
        </form>
    </div>
</div>

<div id="deleteModal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <h2>댓글 삭제</h2>
        <form th:action="@{/comment/delete}" method="post" class="board-form">
            <input type="hidden" name="postId" th:value="${post.postId}" />
            <div class="form-group">
                <label>삭제할 댓글 번호</label>
                <input type="number" name="commentId" id="modalDeleteId" readonly style="background: #eee;" />
            </div>
            <div class="form-group">
                <label>아이디 확인</label>
                <input type="text" name="authorId" required />
            </div>
            <div class="form-group">
                <label>비밀번호 확인</label>
                <input type="password" name="password" required />
            </div>
            <p style="color: #ef4444; margin-top: 10px; font-weight: 700;">정말로 삭제하시겠습니까?</p>
            <div class="modal-btns">
                <button type="submit" class="btn-primary">확인</button>
                <button type="button" class="btn-danger close">취소</button>
            </div>
        </form>
    </div>
</div>

</div>
</html>
