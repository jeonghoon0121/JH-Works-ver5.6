<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/defaultLayout :: layout(~{::article})}">
<head>
    <title>게시판 목록</title>
    <style>
        .board-list-container { padding: 20px; }
        .board-table th { color: #475569; font-size: 14px; text-transform: uppercase; letter-spacing: 0.05em; }
        .board-table tbody tr { cursor: pointer; }

        /* 상태별 배지 색상 디자인 */
        .badge-active { background: #dcfce7; color: #166534; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .badge-inactive { background: #fee2e2; color: #991b1b; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
    </style>
</head>

<article>
    <div class="board-list-container">
        <h1 style="font-size: 24px; font-weight: 800; margin-bottom: 25px;">📋 게시판 목록</h1>

        <div class="list-controls-wrapper" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <!-- 검색 폼 -->
            <form th:action="@{/board}" method="get" style="display: flex; gap: 8px;">
                <input type="text" name="keyword" th:value="${param.keyword}" placeholder="게시판 이름으로 검색"
                       style="padding: 10px 15px; border: 1px solid var(--border-color); border-radius: 8px; width: 250px;">
                <button type="submit" class="btn-action btn-update" style="padding: 10px 20px;">검색</button>
            </form>

            <!-- 액션 버튼 -->
            <div class="action-buttons" style="display: flex; gap: 8px;">
                <button class="btn-action btn-add" th:onclick="|location.href='/board/add'|">게시판 추가</button>
            </div>
        </div>

        <table class="board-table" style="width: 100%; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; border: 1px solid var(--border-color);">
            <thead style="background: #f8fafc; border-bottom: 2px solid var(--border-color);">
            <tr>
                <th style="padding: 15px; width: 80px; text-align: center;">번호</th>
                <th style="padding: 15px; text-align: left;">게시판 이름</th>
                <th style="padding: 15px; text-align: left;">설명</th>
                <th style="padding: 15px; width: 120px; text-align: center;">사용자 접속</th>
                <th style="padding: 15px; width: 120px; text-align: center;">관리자 권한</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="board : ${boardList}"
                style="border-bottom: 1px solid var(--border-color); transition: background 0.2s;"
                th:onmouseover="this.style.background='#f1f5f9'"
                th:onmouseout="this.style.background='white'"
                th:onclick="|location.href='/board/' + ${board.boardId}|">

                <td style="padding: 15px; text-align: center; color: #64748b;" th:text="${board.boardId}"></td>

                <td style="padding: 15px; font-weight: 600;">
                    <!-- tr에 클릭 이벤트가 있으므로 <a> 태그는 스타일용으로 두거나 텍스트로 처리 -->
                    <span th:text="${board.name}" style="color: var(--primary-color);"></span>
                </td>

                <td style="padding: 15px; color: #475569;" th:text="${board.description}"></td>

                <td style="padding: 15px; text-align: center;">
                        <span th:class="${board.userActive} ? 'badge-active' : 'badge-inactive'"
                              th:text="${board.userActive} ? '허용' : '차단'"></span>
                </td>

                <td style="padding: 15px; text-align: center;">
                        <span th:class="${board.adminActive} ? 'badge-active' : 'badge-inactive'"
                              th:text="${board.adminActive} ? '정상' : '제한'"></span>
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(boardList)}">
                <td colspan="5" style="padding: 50px; text-align: center; color: #94a3b8;">
                    생성된 게시판이 없습니다.
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</article>
</html>
