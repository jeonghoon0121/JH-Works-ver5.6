<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/defaultLayout}">

<div layout:fragment="content">
    <div class="form-container">
        <div class="post-list-container">
            <h1>📋 전체 게시글 목록</h1>

            <div class="list-controls-wrapper">
                <!-- 검색 폼 -->
                <form th:action="@{/post/list}" method="get">
                    <input type="text" name="keyword" th:value="${param.keyword}" placeholder="검색어를 입력하세요">
                    <button type="submit" class="btn-action btn-update">검색</button>
                </form>

                <button class="btn-action btn-add" th:onclick="|location.href='/post/write'|">글쓰기</button>
            </div>

            <table class="board-table">
                <thead>
                <tr>
                    <th>번호</th>
                    <th>제목</th>
                    <th>작성자</th>
                    <th>작성일</th>
                    <th>조회</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="post : ${postList}"
                    th:onclick="|location.href='/post/${post.postId}'|">

                    <td th:text="${post.postId}"></td>

                    <td>
                        <span th:text="${post.title}"></span>
                    </td>

                    <td>
                        <span class="author-badge" th:text="${post.authorId}"></span>
                    </td>

                    <td th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd')}"></td>

                    <td th:text="${post.viewCount}"></td>
                </tr>

                <tr th:if="${#lists.isEmpty(postList)}">
                    <td colspan="5">등록된 게시글이 없습니다.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</html>
