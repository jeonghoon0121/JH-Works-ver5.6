<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<header th:fragment="headerFragment">
    <a th:href="@{/}" class="logo">JH Works</a>

    <div class="nav-container">
        <nav>
            <a th:href="@{/about}">소개</a>
            <a th:href="@{/features}">기능</a>
            <a th:href="@{/tools}">도구</a>
            <a th:href="@{/dashboard}">대시보드</a>
        </nav>

        <div class="mega-menu">
            <div class="mega-menu-content">
                <div class="menu-column">
                    <h3>소개</h3>
                    <a th:href="@{/about/intro}">프로젝트개요</a>
                    <a th:href="@{/about/techStack}">기술스택</a>
                    <a th:href="@{/about/requirements}">요구사항정의</a>
                    <a th:href="@{/about/workflow}">업무 흐름도</a>
                    <a th:href="@{/about/architecture&DB}">설계</a>
                </div>
                <div class="menu-column">
                    <h3>기능</h3>
                    <a th:href="@{/features/board}">게시판</a>
                    <a th:href="@{/features/member}">회원</a>
                    <a th:href="@{/features/admin}">관리</a>
                </div>
                <div class="menu-column">
                    <h3>도구</h3>
                    <a th:href="@{/tools/calculator}">계산기</a>
                </div>
                <div class="menu-column">
                    <h3>관제</h3>
                    <a th:href="@{/dashboard}">대시보드</a>
                </div>
            </div>
        </div>
    </div>

    <div class="header-right">
        <th:block th:if="${session.loginMember == null}">
            <button class="btn-login" th:onclick="|location.href='@{/member/login}'|">로그인</button>
            <button class="btn-register" th:onclick="|location.href='@{/member/register}'|">회원가입</button>
        </th:block>
        <th:block th:if="${session.loginMember != null}">
            <span class="user-name" th:text="${session.loginMember.name} + '님'"></span>
            <button class="btn-logout" th:onclick="|location.href='@{/member/logout}'|">로그아웃</button>
        </th:block>
    </div>
</header>
</html>
