<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<aside th:fragment="asideFragment">
    <button th:onclick="|location.href='/post/add'|">글쓰기</button>
    <button th:onclick="|location.href='/post/update'|">글수정</button>
    <button th:onclick="|location.href='/post/delete'|">글삭제</button>
    <span class="nav-label">Boards</span>
    <div class="nav-divider"></div>
    <div th:if="${boardList != null}" th:each="board : ${boardList}">
        <button th:onclick="|location.href='/board/' + [[${board.boardId}]]|"
                th:text="${board.name}">
        </button>
    </div>
    <button th:onclick="|location.href='/board'|">board</button>
    <button th:onclick="|location.href='/post'|">post</button>
    <script>
        function toggleSidebar() {
        const sidebar = document.querySelector('aside');
        sidebar.classList.toggle('mobile-open');
    }

    // 메뉴 밖을 클릭하면 닫히게 하고 싶을 때 (선택 사항)
    document.addEventListener('click', function(event) {
        const sidebar = document.querySelector('aside');
        const btn = document.querySelector('.hamburger-btn');

        if (!sidebar.contains(event.target) && !btn.contains(event.target)) {
            sidebar.classList.remove('mobile-open');
        }
    });
    </script>
</aside>

</html>
