<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/defaultLayout :: head}"></head>
<body>
<header th:replace="~{layout/defaultLayout :: header}"></header>

<main>
    <aside th:replace="~{layout/defaultLayout :: aside}"></aside>

    <article>
        <!-- 게시판 상단 정보 -->
        <div class="board-header" style="margin-bottom: 30px; border-left: 5px solid var(--primary-color); padding-left: 20px;">
            <h2 th:text="${board.name}" style="font-size: 32px; font-weight: 800; margin-bottom: 8px; color: #1e293b;">게시판 이름</h2>
            <p th:text="${board.description}" style="color: #64748b; font-size: 16px;">게시판 설명입니다.</p>
        </div>

        <!-- 검색 및 액션 버튼 -->
        <div class="board-controls-wrapper" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
            <form th:action="@{/board/{id}/search(id=${board.boardId})}" method="get" class="search-form" style="display: flex; gap: 8px;">
                <input type="text" name="keyword" placeholder="기술 로그, 프로젝트 검색..."
                       style="padding: 10px 18px; border: 1px solid var(--border-color); border-radius: 10px; width: 280px; font-size: 14px;">
                <button type="submit" class="btn-action btn-update" style="padding: 10px 20px; border-radius: 10px; font-weight: 600;">검색</button>
            </form>

        </div>

        <!-- 게시글 테이블 -->
        <table class="board-table" style="width: 100%; border-collapse: separate; border-spacing: 0; background: white; border-radius: 16px; overflow: hidden; border: 1px solid var(--border-color); box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05);">
            <thead style="background: #f8fafc; border-bottom: 2px solid var(--border-color);">
            <tr>
                <th style="padding: 18px; width: 80px; text-align: center; color: #475569; font-size: 13px; text-transform: uppercase;">No.</th>
                <th style="padding: 18px; text-align: left; color: #475569; font-size: 13px; text-transform: uppercase;">Subject</th>
                <th style="padding: 18px; width: 140px; text-align: center; color: #475569; font-size: 13px; text-transform: uppercase;">Author</th>
                <th style="padding: 18px; width: 80px; text-align: center; color: #475569; font-size: 13px; text-transform: uppercase;">Views</th>
                <th style="padding: 18px; width: 150px; text-align: center; color: #475569; font-size: 13px; text-transform: uppercase;">Date</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="post : ${postList}"
                style="border-bottom: 1px solid var(--border-color); transition: all 0.2s; cursor: pointer;"
                th:onmouseover="this.style.background='#f1f5f9'"
                th:onmouseout="this.style.background='white'"
                th:onclick="|location.href='/post/${post.postId}'|">

                <td style="padding: 18px; text-align: center; color: #94a3b8; font-family: monospace;" th:text="${post.postId}"></td>

                <td style="padding: 18px;">
                    <!-- ✅ 1. 카테고리 배지 (기술 분야 강조) -->
                    <span th:if="${post.category != null and post.category != ''}"
                          th:text="${post.category}"
                          style="background: #e0f2fe; color: #0369a1; padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: 700; margin-right: 8px; vertical-align: middle;"></span>

                    <!-- 제목 -->
                    <a th:href="@{/post/{id}(id=${post.postId})}" th:text="${post.title}"
                       style="text-decoration: none; color: #1e293b; font-weight: 600; vertical-align: middle; font-size: 15px;"></a>

                    <!-- ✅ 2. 신규 글 배지 (old 가 0일 때만 표시) -->
                    <span th:if="${!post.old}"
                          style="background: #ef4444; color: white; font-size: 10px; padding: 1px 5px; border-radius: 4px; margin-left: 6px; vertical-align: middle; font-weight: 800; animation: pulse 2s infinite;">N</span>
                </td>

                <td style="padding: 18px; text-align: center;">
                    <span class="author-badge" th:text="${post.authorId}"
                          style="background: #f1f5f9; color: #475569; padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; border: 1px solid #e2e8f0;"></span>
                </td>
                <td style="padding: 18px; text-align: center; font-weight: 500; color: #64748b;" th:text="${post.viewCount}"></td>
                <td style="padding: 18px; text-align: center; color: #94a3b8; font-size: 13px;"
                    th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd')}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(postList)}">
                <td colspan="5" style="padding: 80px; text-align: center; color: #94a3b8; font-size: 15px;">
                    <div style="margin-bottom: 10px; font-size: 24px;">📝</div>
                    아직 등록된 기술 로그가 없습니다. 첫 기록을 남겨보세요!
                </td>
            </tr>
            </tbody>
        </table>

        <div class="pagination-wrapper" th:if="${totalPages > 0}" style="margin-top: 30px; display: flex; justify-content: center;">
            <ul class="pagination" style="display: flex; list-style: none; gap: 5px; padding: 0;">
                <li th:if="${currentPage > 1}">
                    <a th:href="@{/board/{id}(id=${board.boardId}, page=${currentPage - 1})}" class="page-link">&lt;</a>
                </li>

                <li th:each="pageNum : ${#numbers.sequence(1, totalPages)}">
                    <a th:href="@{/board/{id}(id=${board.boardId}, page=${pageNum})}"
                       th:text="${pageNum}"
                       class="page-link"
                       th:classappend="${pageNum == currentPage} ? 'active' : ''"></a>
                </li>

                <li th:if="${currentPage < totalPages}">
                    <a th:href="@{/board/{id}(id=${board.boardId}, page=${currentPage + 1})}" class="page-link">&gt;</a>
                </li>
            </ul>
        </div>
    </article>
</main>

<footer th:replace="~{layout/defaultLayout :: footer}"></footer>

<style>
    /* 신규 배지 깜빡임 효과 (선택사항) */
    @keyframes pulse {
        0% { opacity: 1; }
        50% { opacity: 0.6; }
        100% { opacity: 1; }
    }

    .page-link {
        display: block;
        padding: 10px 16px;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        text-decoration: none;
        color: #475569;
        font-weight: 500;
        transition: all 0.2s;
    }
    .page-link:hover { background: #f1f5f9; color: var(--primary-color); border-color: var(--primary-color); }
    .page-link.active {
        background: var(--primary-color);
        color: white;
        border-color: var(--primary-color);
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
</style>
</body>
</html>
