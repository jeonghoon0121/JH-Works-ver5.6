<header th:fragment="headerFragment">
    <div class="header-left">
        <button class="hamburger-btn" onclick="toggleSidebar()">☰</button>
        <a th:href="@{/}" class="logo">JH Works</a>
    </div>

    <div class="header-center">
        <nav class="main-nav">
            <!-- 1. 상단 메뉴 글자들 (이 부분만 반복됨) -->
            <div class="nav-item" th:each="menu : ${ {'about', 'features', 'tools', 'dashboard'} }">
                <a th:href="@{/{path}(path=${menu})}"
                   th:text="${menu == 'about' ? '소개' : (menu == 'features' ? '기능' : (menu == 'tools' ? '도구' : '대시보드'))}"></a>
            </div>
            <div class="nav-item"><a href="https://github.com/...">깃허브</a></div>

            <!-- 2. 통합 메가 메뉴 (반복문 바깥에 위치) -->
            <div class="mega-menu">
                <div class="mega-grid">
                    <!-- 소개 섹션 -->
                    <div class="mega-column">
                        <h3>소개</h3>
                        <a th:href="@{/about/intro}">프로젝트 개요</a>
                        <a th:href="@{/about/techStack}">기술 스택</a>
                        <a th:href="@{/about/architecture&DB}">아키텍처</a>
                    </div>
                    <!-- 기능 섹션 -->
                    <div class="mega-column">
                        <h3>기능</h3>
                        <a th:href="@{/features/auth}">인증</a>
                        <a th:href="@{/features/board}">게시판</a>
                    </div>
                    <!-- 나머지 도구, 대시보드 컬럼들도 여기에 추가 -->
                </div>
            </div>
        </nav>
    </div>

    <div class="header-right">
        <!-- 로그인/로그아웃 버튼 (기존 유지) -->
    </div>
</header>
