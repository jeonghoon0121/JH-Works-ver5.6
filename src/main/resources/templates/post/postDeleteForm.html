<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/defaultLayout :: head}"></head>
<body>
<header th:replace="~{layout/defaultLayout :: header}"></header>

<main>
    <aside th:replace="~{layout/defaultLayout :: aside}"></aside>

    <article>
        <div class="form-container" style="max-width: 500px; margin: 40px auto;">
            <form class="board-form" th:action="@{/post/delete}" th:object="${post}" method="post"
                  onsubmit="return confirm('정말로 삭제하시겠습니까? 삭제 후에는 복구할 수 없습니다.');"
                  style="background: white; padding: 40px; border-radius: 16px; border: 1px solid #fecaca; box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);">

                <h2 style="font-size: 24px; font-weight: 800; color: #dc2626; margin-bottom: 8px;">🗑️ 게시글 삭제</h2>
                <p style="color: #64748b; margin-bottom: 30px; font-size: 14px;">게시글 번호와 비밀번호를 입력하면 영구 삭제됩니다.</p>

                <div style="background-color: #fef2f2; padding: 20px; border-radius: 12px; border: 1px solid #fee2e2; margin-bottom: 25px;">
                    <label style="display: block; font-weight: 700; color: #dc2626; margin-bottom: 8px;">삭제할 게시글 번호</label>
                    <input type="number" th:field="*{postId}" placeholder="번호 입력" required
                           style="width: 100%; padding: 12px; border: 1px solid #fecaca; border-radius: 8px; font-weight: bold;" />
                </div>

                <div class="form-group" style="margin-bottom: 20px;">
                    <label style="display: block; font-weight: 600; margin-bottom: 8px;">작성자 아이디</label>
                    <input type="text" th:field="*{authorId}" placeholder="아이디 확인" required
                           style="width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px;" />
                </div>

                <div class="form-group" style="margin-bottom: 30px;">
                    <label style="display: block; font-weight: 600; margin-bottom: 8px;">비밀번호</label>
                    <input type="password" th:field="*{password}" placeholder="비밀번호 확인" required
                           style="width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px;" />
                </div>

                <div style="display: flex; gap: 10px;">
                    <button type="button" class="btn-action btn-update" style="flex: 1; padding: 15px;" onclick="history.back()">취소</button>
                    <button type="submit" style="flex: 2; background: #dc2626; color: white; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; transition: background 0.2s;"
                            onmouseover="this.style.background='#b91c1c'" onmouseout="this.style.background='#dc2626'">게시글 영구 삭제</button>
                </div>
            </form>
        </div>
    </article>
</main>

<footer th:replace="~{layout/defaultLayout :: footer}"></footer>
</body>
</html>
