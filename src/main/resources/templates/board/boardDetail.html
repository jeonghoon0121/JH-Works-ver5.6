<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/defaultLayout}">
<body>
<div layout:fragment="content"> <!-- article 대신 layout:fragment 사용 -->


        <table class="board-table">
            <thead>
            <tr>
                <th>No.</th>
                <th>Subject</th>
                <th>Author</th>
                <th>Views</th>
                <th>Date</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="post : ${postList}">

                <td th:text="${post.postId}"></td>

                <td>
                    <!-- 카테고리 -->
                    <span th:if="${post.category != null and post.category != ''}"
                          th:text="${post.category}" class="badge-category"></span>

                    <!-- 제목 (여기만 링크) -->
                    <a th:href="@{/post/{id}(id=${post.postId})}"
                       th:text="${post.title}"
                       class="post-title-link"></a>

                    <!-- 신규 -->
                    <span th:if="${!post.old}" class="badge-new">N</span>
                </td>

                <td>
                    <span class="author-badge" th:text="${post.authorId}"></span>
                </td>

                <td th:text="${post.viewCount}"></td>

                <td th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd')}"></td>
            </tr>
            </tbody>
            </table>
        <!-- 페이지네이션 -->
        <div class="pagination-wrapper" th:if="${totalPages > 0}">
            <ul class="pagination">
                <li th:if="${currentPage > 1}">
                    <a th:href="@{/board/{id}(id=${board.boardId}, page=${currentPage - 1})}" class="page-link">&lt;</a>
                </li>

                <li th:each="pageNum : ${#numbers.sequence(1, totalPages)}">
                    <a th:href="@{/board/{id}(id=${board.boardId}, page=${pageNum})}"
                       th:text="${pageNum}"
                       class="page-link"
                       th:classappend="${pageNum == currentPage} ? 'active' : ''"></a>
                </li>

                <li th:if="${currentPage < totalPages}">
                    <a th:href="@{/board/{id}(id=${board.boardId}, page=${currentPage + 1})}" class="page-link">&gt;</a>
                </li>
            </ul>

        </div>
</div>
</body>
</html>
