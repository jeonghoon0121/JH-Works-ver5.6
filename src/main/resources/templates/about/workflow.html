<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/defaultLayout}">

<head>
    <title>업무 흐름도 - Web Log</title>
</head>

<body>
<div layout:fragment="content">
    <div class="workflow-container" style="padding: 30px;">

        <div class="page-header" style="margin-bottom: 30px; border-bottom: 2px solid #e2e8f0; padding-bottom: 15px;">
            <h1 style="font-size: 28px; font-weight: 800; color: #1e293b;">🔄 업무 흐름도</h1>
            <p style="color: #64748b; margin-top: 5px;">사용자 작업 흐름과 시스템 내부 프로세스의 연동 과정입니다.</p>
        </div>

        <div class="workflow-content" style="display: flex; flex-direction: column; gap: 40px;">

            <div class="workflow-card" style="background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); border: 1px solid #e2e8f0;">
                <h3 style="font-size: 20px; color: #1e293b; margin-bottom: 15px; padding-left: 10px; border-left: 4px solid #3b82f6;">
                    1. 프로세스 맵 (기본 흐름)
                </h3>
                <div style="background-color: #f8fafc; border-radius: 10px; padding: 10px; text-align: center;">
                    <img th:src="@{/images/업무1.jpg}" alt="업무 흐름도 1"
                         style="max-width: 100%; height: auto; border-radius: 5px; border: 1px solid #f1f5f9;">
                </div>
            </div>

            <div class="workflow-card" style="background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); border: 1px solid #e2e8f0;">
                <h3 style="font-size: 20px; color: #1e293b; margin-bottom: 15px; padding-left: 10px; border-left: 4px solid #3b82f6;">
                    2. 서비스 상세 흐름 (상세 프로세스)
                </h3>
                <div style="background-color: #f8fafc; border-radius: 10px; padding: 10px; text-align: center;">
                    <img th:src="@{/images/업무2.jpg}" alt="업무 흐름도 2"
                         style="max-width: 100%; height: auto; border-radius: 5px; border: 1px solid #f1f5f9;">
                </div>
            </div>

        </div>

        <div style="height: 50px;"></div>
    </div>
</div> </body>
</html>
