<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/defaultLayout}">

<div layout:fragment="content">
    <div class="form-container">
        <form class="board-form" th:action="@{/post/add}" th:object="${post}" method="post" enctype="multipart/form-data">

            <h2 class="form-title">✍️ 새 글 작성</h2>

            <!-- 게시판 선택 -->
            <div class="form-group">
                <label>게시판 선택</label>
                <select th:field="*{boardId}" required>
                    <option th:each="board : ${boardList}"
                            th:value="${board.boardId}"
                            th:text="${board.name}">
                    </option>
                </select>
            </div>

            <!-- 작성자 & 비밀번호 -->
            <div class="form-row">
                <div class="form-group">
                    <label>작성자 아이디</label>
                    <input type="text" th:field="*{authorId}" placeholder="아이디" required>
                </div>
                <div class="form-group">
                    <label>비밀번호</label>
                    <input type="password" th:field="*{password}" placeholder="비밀번호" maxlength="20" required>
                </div>
            </div>

            <!-- 카테고리 -->
            <div class="form-group">
                <label>카테고리</label>
                <select th:field="*{category}">
                    <option th:each="cat : ${#strings.arraySplit('Project,Issue,Java,Springboot,DB,System,Network,test', ',')}"
                            th:value="${cat}" th:text="${cat}"></option>
                    <option value="">카테고리 없음</option>
                </select>
            </div>

            <!-- 제목 -->
            <div class="form-group">
                <label>제목</label>
                <input type="text" th:field="*{title}" placeholder="제목을 입력하세요" required>
            </div>

            <!-- 내용 -->
            <div class="form-group">
                <label>내용</label>
                <textarea th:field="*{content}" rows="10" placeholder="내용을 작성하세요"></textarea>
            </div>

            <!-- 파일 -->
            <div class="form-group">
                <label>첨부 파일</label>
                <input type="file" name="file">
            </div>

            <!-- 버튼 -->
            <div class="btn-group">
                <button type="button" class="btn-cancel" onclick="history.back()">취소</button>
                <button type="submit" class="btn-submit">작성 완료</button>
            </div>
        </form>
    </div>
</div>
</html>
