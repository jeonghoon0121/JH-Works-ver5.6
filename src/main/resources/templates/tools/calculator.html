<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/defaultLayout :: head}">
    <title>계산기 - Web Log</title>
</head>

<body>
<header th:replace="~{layout/defaultLayout :: header}"></header>

<main>
    <aside th:replace="~{layout/defaultLayout :: aside}"></aside>

    <article>
        <div class="calculator-container" style="padding: 30px;">

            <div class="page-header" style="margin-bottom: 30px; border-bottom: 2px solid #e2e8f0; padding-bottom: 15px;">
                <h1 style="font-size: 28px; font-weight: 800; color: #1e293b;">🔢 스마트 계산기</h1>
                <p style="color: #64748b; margin-top: 5px;">간단한 사칙연산을 수행할 수 있는 웹 도구입니다.</p>
            </div>

            <div class="workflow-content" style="display: flex; justify-content: center; padding: 20px;">
                <div class="calc-card" style="background: #1e293b; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 340px;">
                    <input type="text" id="display" readonly value="0"
                           style="width: 100%; height: 70px; background: #0f172a; color: #38bdf8; border: none; border-radius: 12px; text-align: right; padding: 20px; font-size: 2rem; font-family: 'Courier New', monospace; margin-bottom: 20px; box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);">

                    <div class="calc-grid" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;">
                        <button onclick="clearDisplay()" style="background: #ef4444; color: white;">C</button>
                        <button onclick="deleteLast()" style="background: #64748b; color: white;">DEL</button>
                        <button onclick="appendToDisplay('/')" style="background: #f59e0b; color: white;">÷</button>
                        <button onclick="appendToDisplay('*')" style="background: #f59e0b; color: white;">×</button>

                        <button onclick="appendToDisplay('7')" style="background: #334155; color: white;">7</button>
                        <button onclick="appendToDisplay('8')" style="background: #334155; color: white;">8</button>
                        <button onclick="appendToDisplay('9')" style="background: #334155; color: white;">9</button>
                        <button onclick="appendToDisplay('-')" style="background: #f59e0b; color: white;">-</button>

                        <button onclick="appendToDisplay('4')" style="background: #334155; color: white;">4</button>
                        <button onclick="appendToDisplay('5')" style="background: #334155; color: white;">5</button>
                        <button onclick="appendToDisplay('6')" style="background: #334155; color: white;">6</button>
                        <button onclick="appendToDisplay('+')" style="background: #f59e0b; color: white;">+</button>

                        <button onclick="appendToDisplay('1')" style="background: #334155; color: white;">1</button>
                        <button onclick="appendToDisplay('2')" style="background: #334155; color: white;">2</button>
                        <button onclick="appendToDisplay('3')" style="background: #334155; color: white;">3</button>
                        <button onclick="calculate()" style="background: #10b981; color: white; grid-row: span 2;">=</button>

                        <button onclick="appendToDisplay('0')" style="background: #334155; color: white; grid-column: span 2;">0</button>
                        <button onclick="appendToDisplay('.')" style="background: #334155; color: white;">.</button>
                    </div>
                </div>
            </div>

            <style>
                .calc-grid button {
                    height: 60px;
                    border: none;
                    border-radius: 10px;
                    font-size: 1.2rem;
                    font-weight: bold;
                    cursor: pointer;
                    transition: all 0.2s;
                }
                .calc-grid button:hover {
                    filter: brightness(1.2);
                    transform: translateY(-2px);
                }
                .calc-grid button:active {
                    transform: translateY(0);
                }
            </style>

            <script>
                const display = document.getElementById('display');
                function appendToDisplay(v) {
                    if (display.value === '0' && v !== '.') display.value = v;
                    else display.value += v;
                }
                function clearDisplay() { display.value = '0'; }
                function deleteLast() {
                    display.value = display.value.slice(0, -1);
                    if (display.value === '') display.value = '0';
                }
                function calculate() {
                    try {
                        // 결과값을 깔끔하게 출력 (소수점 8자리 제한)
                        let result = eval(display.value);
                        display.value = Number.isInteger(result) ? result : result.toFixed(4);
                    } catch (e) {
                        display.value = 'Error';
                        setTimeout(clearDisplay, 1500);
                    }
                }
            </script>
            <div style="height: 50px;"></div>
        </div>
    </article>
</main>

<footer th:replace="~{layout/defaultLayout :: footer}"></footer>
</body>
</html>
