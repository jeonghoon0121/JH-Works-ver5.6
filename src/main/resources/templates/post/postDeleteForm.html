<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/defaultLayout}">

<main layout:fragment="content"> <!-- defaultLayout의 <main> 태그와 구조 일치 -->
    <div class="form-container">
        <!-- th:object를 통해 PostDTO 또는 관련 객체와 연결 -->
        <form th:action="@{/post/delete}" th:object="${post}" method="post" class="delete-form">

            <h2 class="form-title">🗑️ 게시글 삭제</h2>
            <p class="warning-msg">게시글을 삭제하려면 비밀번호를 입력해주세요. 삭제된 데이터는 복구할 수 없습니다.</p>

            <!-- 1. postId는 사용자에게 보일 필요가 없으므로 hidden 처리[cite: 4] -->
            <input type="hidden" th:field="*{postId}">

            <div class="form-group">
                <label for="password">비밀번호 확인</label>
                <!-- 2. th:field를 사용하여 name, id, value 자동 매핑[cite: 4] -->
                <input type="password" th:field="*{password}"
                       id="password" placeholder="비밀번호 입력"
                       class="form-control" required>
            </div>

            <div class="btn-group">
                <button type="button" class="btn-cancel" onclick="history.back()">취소</button>
                <!-- 삭제 전 사용자 확인 스크립트 -->
                <button type="submit" class="btn-delete"
                        onclick="return confirm('정말 삭제하시겠습니까?')">삭제하기</button>
            </div>
        </form>
    </div>
</main>
</html>
