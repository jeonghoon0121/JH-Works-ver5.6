<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/defaultLayout :: head}"></head>
<body>
<header th:replace="~{layout/defaultLayout :: header}"></header>

<main>
    <aside th:replace="~{layout/defaultLayout :: aside}"></aside>

    <article>
        <!-- 게시판 삭제 폼 -->
        <form th:action="@{/board/delete}" method="post" class="board-form" onsubmit="return confirm('정말로 삭제하시겠습니까?');">
            <h2>게시판 삭제</h2>
            <p style="font-size: 13px; color: #666; margin-bottom: 15px;">삭제된 게시판은 복구할 수 없습니다.</p>

            <label for="boardId">삭제할 게시판 ID</label>
            <input type="number" id="boardId" name="boardId" placeholder="ID 번호 입력" required />

            <button type="submit" class="btn-delete">게시판 영구 삭제</button>
        </form>
    </article>
</main>

<footer th:replace="~{layout/defaultLayout :: footer}"></footer>
</body>
</html>
