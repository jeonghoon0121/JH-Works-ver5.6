<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/defaultLayout}">

<head>
    <title>프로젝트 개요 - Web Log</title>
</head>

<body>
<div layout:fragment="content">
    <div class="intro-page-container" style="padding: 30px;">

        <div class="page-header" style="margin-bottom: 40px; border-bottom: 2px solid #e2e8f0; padding-bottom: 15px;">
            <h1 style="font-size: 28px; font-weight: 800; color: #1e293b;">📋 프로젝트 개요</h1>
            <p style="color: #64748b; margin-top: 5px;">Web Log 프로젝트의 목적과 시스템 구성을 소개합니다.</p>
        </div>

        <div class="image-gallery-wrapper" style="display: flex; flex-direction: column; gap: 40px;">

            <div class="img-card" style="background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); border: 1px solid #e2e8f0;">
                <h3 style="font-size: 18px; color: #1e293b; margin-bottom: 15px; padding-left: 10px; border-left: 4px solid #3b82f6;">1. 프로젝트 목적 및 배경</h3>
                <img th:src="@{/images/개요1.jpg}" alt="프로젝트 개요 1"
                     style="width: 100%; height: auto; border-radius: 8px; border: 1px solid #f1f5f9;">
            </div>

            <div class="img-card" style="background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); border: 1px solid #e2e8f0;">
                <h3 style="font-size: 18px; color: #1e293b; margin-bottom: 15px; padding-left: 10px; border-left: 4px solid #3b82f6;">2. 시스템 인터페이스</h3>
                <img th:src="@{/images/개요2.jpg}" alt="프로젝트 개요 2"
                     style="width: 100%; height: auto; border-radius: 8px; border: 1px solid #f1f5f9;">
            </div>

        </div>
        <div style="height: 50px;"></div>
    </div>
</div>

</body>
</html>
